name: CI-Polaris-Basic
on:
  push:
    branches: [main, master, develop, stage, release]
  pull_request:
    branches: [main, master, develop, stage, release]
  workflow_dispatch:
  
  
jobs:
  build:
    runs-on: [ubuntu-latest] 
    #runs-on: [Win-sh]
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
    - name: Polaris Scan
      id: polaris-scan
      uses: blackduck-inc/black-duck-security-scan@v2
      with:
        ### SCANNING: Required fields
        polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
        polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }} 
        #polaris_access_token: ${{ secrets.STG_POLARIS_ACCESS_TOKEN }} 

        polaris_assessment_types: "SAST"
        
        ### SCANNING: Optional fields
        polaris_application_name: "Hari_JuiceShop_LocalTest_Take2"
        polaris_project_name: "Juice Shop Testing Local_2"
        polaris_test_sast_type: "SAST-FULL"
        polaris_test_sast_location: "local"

                ### PULL REQUEST COMMENTS: Uncomment below to enable
        polaris_prComment_enabled: true 
        github_token: ${{ secrets.GITHUB_TOKEN }} # Required when PR comments is enabled

                ### SARIF report parameters
        polaris_reports_sarif_create: true
        polaris_upload_sarif_report: true
        include_diagnostics: true

   

                ### Signature scan
        #polaris_test_sca_type: "SCA-SIGNATURE"

         ### SAST SCAN
        #polaris_test_sast_type: "SAST_FULL_ISSUE_UPLOAD"


                ### Mark build status if policy violating issues are found
        # mark_build_status: 'success'

                ### Uncomment below configuration to add custom logic based on return status
        # - name: cmdLine
        #   id: cmdLine
        #   run: |
        #     EXIT_CODE=${{ steps.polaris-scan.outputs.status }}
        #     echo "Polaris Scan exit status - $EXIT_CODE"
    - name: Save Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bridge-logs
        path: ${{ github.workspace }}/.bridge
        include-hidden-files: true
